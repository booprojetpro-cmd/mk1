<style>

*{box-sizing:border-box} html{scroll-behavior:smooth;background:var(--paper)} body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px} .hidden{display:none!important}
.bubble-field{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--paper)}
.bubble{position:absolute;bottom:-80px;left:var(--left);width:var(--size);height:var(--size);border-radius:50%;border:1.2px solid rgba(10,10,10,0.14);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.7) 0%,rgba(255,255,255,0) 60%),radial-gradient(circle at 75% 75%,rgba(10,10,10,0.02) 0%,rgba(10,10,10,0.08) 100%);box-shadow:inset -1px -1px 3px rgba(10,10,10,0.04),1px 1px 2px rgba(255,255,255,0.5);opacity:0;will-change:transform,opacity;animation:bubbleRise var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
.bubble::after{content:"";position:absolute;top:15%;left:15%;width:25%;height:25%;border-radius:50%;background:rgba(255,255,255,0.85)}
@keyframes bubbleRise{0%{transform:translate3d(0,0,0) scale(0.9);opacity:0}10%{opacity:var(--max-op,0.35)}50%{transform:translate3d(var(--sway),-50vh,0) scale(1.04)}90%{opacity:var(--max-op,0.35)}100%{transform:translate3d(calc(var(--sway)*-0.5),-115vh,0) scale(0.96);opacity:0}}
.splash{position:fixed;inset:0;z-index:800;display:grid;place-items:center;background:#000;overflow:hidden;transition:opacity .72s ease} .splash.fading{opacity:0} .splash video{width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .72s ease, filter .72s ease} @media(max-width:767px){.splash video{transform:scale(1.12)}}

.splash-loader,.app-loader-dot{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 32px rgba(0,0,0,.22)}

.catalog-search-wrap{position:relative;margin:0 0 20px;max-width:520px}
.catalog-search{width:100%!important;height:46px!important;padding-left:44px!important;font-size:15px;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.catalog-search-wrap::before{content:"";position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);background-image:url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A8784' stroke-width='1.6' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='6'/%3E%3Cpath d='M21 21l-3.8-3.8'/%3E%3C/svg%3E");opacity:.9;pointer-events:none}

.profiles{min-height:100vh;display:grid;place-items:center;padding:56px 24px} .profiles-inner{width:min(1080px,100%);text-align:center} .profiles h1{margin:0 0 40px;font-family:var(--serif);font-weight:600;font-size:clamp(36px,5vw,64px);letter-spacing:-.03em;line-height:.95} .profile-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;max-width:860px;margin:0 auto} .profile{border:0;background:transparent;padding:0;color:var(--muted);transition:transform .35s cubic-bezier(.16,1,.3,1),color .2s} .profile:hover{color:var(--ink);transform:translateY(-6px)} .profile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;background:#F2F0ED;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.06);transition:border-color .25s,box-shadow .25s} .profile:hover img{border-color:var(--ink);box-shadow:0 18px 44px rgba(0,0,0,.12)} .profile strong{display:block;margin-top:14px;font-size:14px;font-weight:600}

order-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;display:grid;place-items:center}
.hero{position:relative;isolation:isolate;min-height:92vh;display:flex;align-items:flex-end;overflow:hidden;padding:120px clamp(20px,4vw,48px) 64px;background:#080808;color:#fff} .hero-poster,.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .hero-poster{z-index:0;opacity:.92;transition:opacity .3s ease} .hero-video{z-index:1;opacity:0;transition:opacity .45s ease} .hero-cover{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 36%,rgba(0,0,0,.12) 72%),linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 52%)} .hero-content{position:relative;z-index:3;max-width:720px} .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#CFCAC3} .hero-kicker::before{content:"";width:26px;height:1px;background:currentColor;opacity:.6} .hero h1{font-family:var(--serif);font-weight:500;line-height:.86;letter-spacing:-.05em;font-size:clamp(56px,8.5vw,124px);margin:18px 0 18px;max-width:9ch} .hero p{font-size:clamp(16px,1.5vw,19px);line-height:1.55;color:#E8E2DA;max-width:44ch} .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px} .primary,.secondary,.quiet{min-height:46px;padding:0 22px;border-radius:var(--radius-pill);font-weight:650;font-size:13.5px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s ease,background .18s,color .18s,border-color .18s} .primary{background:#fff;color:#0A0A0A;border:1px solid #fff} .primary:hover{transform:translateY(-1px);background:#F5F1EB} .secondary{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px)} .secondary:hover{background:rgba(255,255,255,.16)} .quiet{background:transparent;border:1px solid var(--line);color:var(--ink)} .hero.trailer-on .hero-video{opacity:1} .hero.trailer-on .hero-poster{opacity:0} .hero.trailer-on .hero-cover{opacity:.42} .hero.trailer-on .hero-content h1,.hero.trailer-on .hero-content p,.hero.trailer-on .hero-kicker{opacity:0;transform:translateY(10px);transition:all .35s ease}
body[data-theme="blue"] { --accent: #2d7dff; }

.content{position:relative;z-index:2;padding:0 clamp(16px,3.6vw,44px) 96px;margin-top:-2px;background:linear-gradient(180deg,rgba(254,253,251,0) 0%,var(--paper) 22px)} @supports (content-visibility:auto){.section,.monte-feature,.series-feature,.pavillon-selection{content-visibility:auto;contain-intrinsic-block-size:440px}} .section{margin:0 0 42px;scroll-margin-top:92px} .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px} .section h2{margin:0;font-family:var(--serif);font-weight:550;letter-spacing:-.02em;font-size:clamp(26px,3vw,36px);line-height:1} .section small{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase} .row-shell{position:relative} .row{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 16px;margin:0 -2px;scroll-snap-type:x proximity;scrollbar-width:none} .row::-webkit-scrollbar{display:none} .row-arrow{position:absolute;z-index:8;top:50%;width:36px;height:36px;margin-top:-18px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);color:var(--ink);font-size:18px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.08);opacity:0;transition:all .22s ease;transform:translateY(-50%) scale(.96)} .row-shell:hover .row-arrow{opacity:1;transform:translateY(-50%) scale(1)} .row-arrow:hover{background:var(--ink);color:#fff;border-color:var(--ink)} .row-arrow.prev{left:8px} .row-arrow.next{right:8px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.card{position:relative;flex:0 0 var(--card);aspect-ratio:16/9;border:1px solid #E2DDD6;border-radius:10px;background:#0A0A0A;color:#111;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.07);scroll-snap-align:start;isolation:isolate;overflow:hidden;transition:transform .32s cubic-bezier(.16,1,.3,1),box-shadow .28s ease,border-color .2s ease}

.card:hover::before{border-color:rgba(255,255,255,.3)}

.thumb:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.08) 66%,rgba(0,0,0,.14) 100%);opacity:.94}
.poster-fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:12px;background:radial-gradient(circle at 82% 18%,rgba(197,168,128,.22),transparent 34%),linear-gradient(135deg,#171717 0%,#050505 70%);color:#fff;overflow:hidden}

.fallback-brand{position:relative;font-size:7px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#C5A880}
.poster-fallback strong{position:relative;display:block;max-width:92%;margin-top:4px;font-family:var(--serif);font-size:13px;font-weight:600;line-height:1.05;color:#fff}
.poster-image{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:0;transition:opacity .24s ease,transform .55s cubic-bezier(.16,1,.3,1)}
.poster-image.is-loaded{opacity:1}
.card:hover .poster-image.is-loaded{transform:scale(1.055)}

.top-row{align-items:stretch}
.top-card{position:relative;display:flex;align-items:flex-end;flex:0 0 clamp(218px,18vw,248px);height:116px;padding-left:42px}

.catalogue{padding-top:104px} .catalogue-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 22px} .catalogue-title h1{margin:0;font-family:var(--serif);font-weight:550;letter-spacing:-.03em;font-size:clamp(38px,5.5vw,64px)} .empty{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;background:#fff} .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 24px} .filters select{height:42px;border:1px solid var(--line);border-radius:var(--radius-pill);background:#fff;padding:0 36px 0 14px;color:var(--ink);font-weight:600;font-size:13px;appearance:none;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%230A0A0A' stroke-width='1.6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center} .filter-count{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.modal{position:fixed;inset:0;z-index:320;background:rgba(253,251,247,.78);backdrop-filter:blur(18px);display:grid;place-items:center;padding:16px} .modal-card{width:min(560px,calc(100vw - 20px));max-height:min(86vh,720px);overflow:auto;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 24px 64px rgba(0,0,0,.16)} .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:2} .modal-head strong{font-family:var(--serif);font-size:16px;font-weight:650;letter-spacing:-.01em} .close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:17px;display:grid;place-items:center} .modal-body{padding:18px} .modal-body h2{font-family:var(--serif);font-size:clamp(22px,3.8vw,30px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px} .modal-body p{color:#4A4743;line-height:1.58;font-size:13.5px;margin:0}

.monte-feature{position:relative;isolation:isolate;min-height:520px;display:flex;align-items:flex-end;overflow:hidden;margin:18px 0 44px;border:1px solid #E8E3DC;border-radius:24px;background:#0A0A0A;color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.12)} .monte-feature video,.monte-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .monte-poster{z-index:-2;opacity:.92;filter:saturate(.9)} .monte-feature video{z-index:-1;opacity:0;transition:opacity .7s ease} .monte-feature.video-ready video{opacity:1} .monte-feature::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.58) 42%,rgba(0,0,0,.14) 78%),linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,0) 58%);pointer-events:none} .monte-content{position:relative;z-index:2;padding:clamp(22px,4vw,44px);max-width:640px} .monte-content h2{font-family:var(--serif);font-size:clamp(34px,5.6vw,58px);line-height:.92;letter-spacing:-.03em;margin:10px 0 10px} .monte-content p{color:#E8E2DA;font-size:14px;line-height:1.55;max-width:44ch;margin:0} .monte-content .primary{background:#fff;color:#0A0A0A;border-color:#fff} .monte-content .primary:hover{background:#F5F1EB}

/* Option unique du panneau enfant */
.kid-settings-card{display:grid;gap:16px}
.kid-settings-copy{display:grid;gap:5px}
.kid-settings-copy strong{font-family:var(--serif);font-size:22px;font-weight:650}
.kid-settings-copy span{color:var(--muted);font-size:13px;line-height:1.55}
.kid-option{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--paper-2)}
.kid-option-text{display:grid;gap:5px}
.kid-option-text strong{font-size:14px}
.kid-option-text small{color:var(--muted);font-size:12px;line-height:1.45}
.toggle-switch{position:relative;flex:0 0 auto;width:54px;height:30px}
.toggle-switch input{position:absolute;opacity:0;pointer-events:none}
.toggle-switch-ui{position:absolute;inset:0;border-radius:999px;background:#D7D2CC;border:1px solid var(--line-strong);transition:background .22s,border-color .22s}
.toggle-switch-ui::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.16);transition:transform .22s}
.toggle-switch input:checked + .toggle-switch-ui{background:#54D36B;border-color:#54D36B}
.toggle-switch input:checked + .toggle-switch-ui::after{transform:translateX(24px)}
.toggle-switch input:focus-visible + .toggle-switch-ui{outline:2px solid var(--ink);outline-offset:3px}
body[data-color-mode="dark"] .toggle-switch-ui{background:#34312E}

/* ===== Pavillon Noir — DA noir & blanc premium 2026 ===== */
:root{
  --paper:#f7f7f5;--paper-2:#ffffff;--ink:#050505;--muted:#747474;--line:#d9d9d5;--line-strong:#a9a9a3;
  --card:clamp(236px,19vw,336px);--radius:16px;--radius-pill:10px;
  --serif:"Archivo Black","Space Grotesk",Arial,sans-serif;--sans:"Space Grotesk",Arial,sans-serif;--display:"Archivo Black","Space Grotesk",Arial,sans-serif;
}
html,body{font-family:var(--sans);letter-spacing:-.012em}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(115deg,transparent 0 37%,rgba(255,255,255,.68) 45%,transparent 54%),radial-gradient(circle at 12% 6%,rgba(255,255,255,.95),transparent 30%),linear-gradient(180deg,#fbfbfa,#eeeeeb);background-size:190% 100%,100% 100%,100% 100%;animation:pnSurfaceSweep 15s ease-in-out infinite alternate}
@keyframes pnSurfaceSweep{to{background-position:100% 0,0 0,0 0}}
.bubble-field{opacity:.22;filter:grayscale(1)}

.topbar{height:78px;background:rgba(248,248,246,.82);border-bottom:1px solid rgba(5,5,5,.13);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 50px rgba(0,0,0,.07);backdrop-filter:blur(24px) saturate(1.05)}
.topbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 10%,rgba(255,255,255,.7) 40%,transparent 58%);transform:translateX(-115%);animation:pnBarReflection 10s ease-in-out infinite}
@keyframes pnBarReflection{0%,62%{transform:translateX(-115%)}82%,100%{transform:translateX(115%)}}
.brand{font-family:var(--display);font-size:17px;letter-spacing:-.03em;text-transform:none}.brand img{border-radius:10px;box-shadow:0 7px 20px rgba(0,0,0,.15)}
.nav{gap:7px;position:relative;z-index:1}.nav button{position:relative;isolation:isolate;overflow:hidden;border:1px solid transparent;border-radius:9px;padding:10px 15px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#686868;clip-path:polygon(4% 0,100% 0,96% 100%,0 92%)}
.nav button::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.9) 48%,transparent 72%);transform:translateX(-140%);transition:transform .55s ease}
.nav button:hover::before{transform:translateX(140%)}
.nav button:hover{background:#ededeb;color:#050505;border-color:#d0d0cc}.nav button.active{background:#050505;color:#fff;border-color:#050505;box-shadow:0 8px 22px rgba(0,0,0,.19),inset 0 1px 0 rgba(255,255,255,.28)}
.nav button[data-view="anime"]::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.65);animation:animeNavPulse 2.3s ease-out infinite}.nav button[data-view="anime"]:not(.active)::after{background:#050505;box-shadow:0 0 0 0 rgba(5,5,5,.35)}
@keyframes animeNavPulse{70%,100%{box-shadow:0 0 0 7px transparent}}
.profile-menu,.settings,.search,.filters select{border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.92) inset,0 8px 25px rgba(0,0,0,.055)}

.hero{min-height:94vh}.hero h1,.series-flagship h1,.series-flagship h2,.monte-content h2{font-family:var(--display);font-weight:400;letter-spacing:-.065em}.hero h1{text-transform:uppercase;text-shadow:0 10px 42px rgba(0,0,0,.55)}
.hero-kicker,.series-label,.series-flagship-eyebrow{font-weight:700;letter-spacing:.19em}
.primary,.secondary,.quiet{position:relative;overflow:hidden;border-radius:9px;font-weight:700;clip-path:polygon(3% 0,100% 0,97% 100%,0 91%)}
.primary::after,.secondary::after,.quiet::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 17%,rgba(255,255,255,.56) 48%,transparent 72%);transform:translateX(-140%);transition:transform .6s ease}.primary:hover::after,.secondary:hover::after,.quiet:hover::after{transform:translateX(140%)}

/* ===== Correctifs 2026 : bandes-annonces, BoJack et page Films ===== */
.monte-feature{background:#050505}
.monte-feature .monte-poster,
.monte-feature .anime-feature-backdrop,
.monte-feature .series-cover-fallback.monte-poster,
.monte-feature .series-cover-image.monte-poster{z-index:0!important;opacity:1;transition:opacity .42s ease,transform .8s cubic-bezier(.16,1,.3,1)}

.monte-feature.video-ready .anime-feature-backdrop,

.feature-poster-fallback{display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 70% 24%,var(--fallback-soft,rgba(197,168,128,.32)),transparent 34%),linear-gradient(135deg,#171717,#030303 70%);color:#fff;text-align:center;overflow:hidden}
.feature-poster-fallback::before{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.13)}

.feature-poster-image{object-position:center 26%}

.bojack-feature{min-height:min(78vh,790px)}

.bojack-cutout{position:absolute;z-index:3;right:clamp(-30px,4vw,72px);bottom:-17%;width:auto;height:116%;max-width:48vw;object-fit:contain;object-position:center bottom;pointer-events:none;filter:drop-shadow(0 28px 34px rgba(0,0,0,.48));transform-origin:50% 90%;animation:bojackIdle 5.8s ease-in-out infinite;will-change:transform}
@keyframes bojackIdle{0%,100%{transform:translate3d(0,0,0) rotate(-.35deg)}50%{transform:translate3d(0,-12px,0) rotate(.55deg)}}

.film-marquee-section{position:relative;isolation:isolate;overflow:hidden;margin:4px 0 62px;padding:clamp(28px,4.5vw,52px) 0 38px;border:1px solid #1f1f1f;border-radius:26px;background:radial-gradient(circle at 18% 0,rgba(255,255,255,.10),transparent 30%),#050505;color:#fff;box-shadow:0 24px 64px rgba(0,0,0,.2)}

.film-marquee-head h2{margin:0;font-family:var(--display);font-size:clamp(38px,6vw,72px);font-weight:400;line-height:.84;letter-spacing:-.06em;text-transform:uppercase}

.film-mosaic-section{margin:0 0 64px}

.portrait-frame{position:relative;isolation:isolate;padding:clamp(11px,1.5vw,18px);background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 5px var(--ink),inset 0 0 0 7px var(--paper),0 18px 36px rgba(0,0,0,.28)}
.portrait-frame::before,.portrait-frame::after{content:"";position:absolute;z-index:4;width:42px;height:42px;border-color:var(--paper);opacity:.88;pointer-events:none}
.portrait-frame::before{left:5px;top:5px;border-left:2px solid;border-top:2px solid;clip-path:polygon(0 0,100% 0,100% 16%,16% 16%,16% 100%,0 100%)}
.portrait-frame::after{right:5px;bottom:5px;border-right:2px solid;border-bottom:2px solid;clip-path:polygon(84% 0,100% 0,100% 100%,0 100%,0 84%,84% 84%)}
.portrait-art{position:relative;overflow:hidden;aspect-ratio:2/3;background:#111;border:1px solid color-mix(in srgb,var(--paper) 45%,transparent)}
.portrait-art::after{content:"";position:absolute;inset:0;z-index:2;box-shadow:inset 0 0 30px rgba(0,0,0,.38);pointer-events:none}
.portrait-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.16,1,.3,1),filter .3s ease}
.portrait-entry:hover .portrait-art img{transform:scale(1.035)}
.portrait-image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#202020,#050505);color:#fff;font-family:var(--display);font-size:clamp(20px,2.5vw,34px);line-height:.9;text-align:center;text-transform:uppercase}
.portrait-copy{padding:18px 3px 2px;text-align:center}
.portrait-copy h3{margin:0;font-family:var(--display);font-size:clamp(19px,2vw,28px);font-weight:400;line-height:.95;letter-spacing:-.04em;text-transform:uppercase}
.portrait-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.portrait-actions button{min-height:43px;border:1px solid var(--ink);border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;transition:transform .18s ease,background .18s ease,color .18s ease}
.portrait-play{background:var(--ink);color:var(--paper)}
.portrait-summary{background:transparent;color:var(--ink)}
.portrait-actions button:hover{transform:translateY(-2px)}
.portrait-summary:hover{background:var(--ink);color:var(--paper)}

.showcase-modal{width:min(860px,calc(100vw - 22px));max-height:min(90vh,820px)}
.showcase-detail{display:grid;grid-template-columns:minmax(190px,260px) minmax(0,1fr);gap:clamp(20px,4vw,42px);align-items:center;padding:clamp(20px,4vw,40px)}
.showcase-detail-poster{position:relative;overflow:hidden;aspect-ratio:2/3;padding:12px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 5px var(--ink),0 24px 56px rgba(0,0,0,.28)}
.showcase-detail-poster img{width:100%;height:100%;object-fit:cover;display:block}

.showcase-detail-copy h2{margin:0 0 15px;font-family:var(--display);font-size:clamp(38px,6vw,68px);font-weight:400;line-height:.84;letter-spacing:-.06em;text-transform:uppercase}
.showcase-detail-copy p{font-size:14px;line-height:1.72}
.showcase-detail-copy .primary{margin-top:24px;background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Page Aléatoire : aucune modale, chaque écran remplace le précédent avec une transition. */
.content.random-content{padding:0!important;margin-top:0;background:var(--paper)}
.random-home{min-height:100vh;padding:94px clamp(16px,3vw,42px) 20px;display:grid;place-items:center;overflow:hidden}
.random-shell{position:relative;isolation:isolate;width:min(1380px,100%);height:min(760px,calc(100vh - 116px));min-height:560px;overflow:hidden;border:1px solid var(--line-strong);background:radial-gradient(circle at 82% 12%,color-mix(in srgb,var(--ink) 10%,transparent),transparent 32%),linear-gradient(145deg,var(--paper-2),var(--paper));box-shadow:0 28px 90px rgba(0,0,0,.16)}
.random-shell::before{content:"ALÉATOIRE";position:absolute;right:-18px;bottom:-44px;z-index:-1;color:color-mix(in srgb,var(--ink) 4%,transparent);font-family:var(--display);font-size:clamp(110px,18vw,260px);letter-spacing:-.08em;pointer-events:none}
.random-shell::after{content:"";position:absolute;inset:13px;z-index:-1;border:1px solid color-mix(in srgb,var(--ink) 17%,transparent);pointer-events:none}
.random-stage{height:100%;padding:clamp(24px,4vw,58px);display:grid;align-items:center;opacity:1;transform:translateY(0) scale(1);filter:blur(0);transition:opacity .28s ease,transform .42s cubic-bezier(.16,1,.3,1),filter .28s ease}
.random-stage.is-leaving{opacity:0;transform:translateY(18px) scale(.985);filter:blur(8px)}
.random-stage.is-entering{animation:randomStageIn .55s cubic-bezier(.16,1,.3,1)}
@keyframes randomStageIn{from{opacity:0;transform:translateY(-18px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.random-eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase}
.random-eyebrow::before{content:"";width:30px;height:1px;background:currentColor}
.random-landing{display:grid;grid-template-columns:minmax(0,.9fr) minmax(420px,1.1fr);gap:clamp(28px,5vw,80px);align-items:center}
.random-landing h1{max-width:9ch;margin:14px 0 17px;font-family:var(--display);font-size:clamp(62px,9vw,128px);font-weight:400;line-height:.78;letter-spacing:-.075em;text-transform:uppercase}

.random-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.random-mode-card{position:relative;min-height:300px;overflow:hidden;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);padding:27px;text-align:left;transition:transform .42s cubic-bezier(.16,1,.3,1),box-shadow .3s ease}

.random-mode-number{display:block;font-family:var(--display);font-size:84px;line-height:.8;opacity:.14}
.random-mode-card strong{position:absolute;left:27px;right:27px;bottom:55px;font-family:var(--display);font-size:clamp(27px,3.2vw,48px);font-weight:400;line-height:.86;letter-spacing:-.05em;text-transform:uppercase}

.random-roulette{display:grid;grid-template-columns:minmax(270px,.72fr) minmax(0,1.28fr);gap:clamp(28px,5vw,76px);align-items:center;height:100%}

.random-poster-wrap.is-switching{transform:scale(.94) rotate(-1deg);opacity:.2;filter:blur(9px)}
.random-poster-media{position:relative;width:100%;height:100%;overflow:hidden;background:#090909}

.random-copy{min-width:0}

.random-copy h2{max-width:11ch;margin:0 0 15px;font-family:var(--display);font-size:clamp(52px,7.5vw,104px);font-weight:400;line-height:.8;letter-spacing:-.07em;text-transform:uppercase;text-wrap:balance}

.random-result-screen{grid-template-rows:1fr}

body[data-color-mode="dark"] .portrait-entry,body[data-color-mode="dark"] .random-list-item,body[data-color-mode="dark"] .random-choice{background:#101010}

}

function playIntroVideoElement(videoEl,onEnd,options={}){
  if(!videoEl){onEnd?.();return}
  const loader=videoEl.parentElement?.querySelector(".splash-loader"),preferMuted=options.preferMuted===true;
  let finished=false,fading=false,fadeTimer=null,safetyTimer=null;
  const showLoader=()=>loader?.classList.remove("hidden");
  const hideLoader=()=>loader?.classList.add("hidden");
  const cleanup=()=>{
    clearTimeout(fadeTimer);clearTimeout(safetyTimer);
    videoEl.removeEventListener("timeupdate",onTime);
    videoEl.removeEventListener("playing",onPlaying);
    videoEl.removeEventListener("canplay",onCanPlay);
    videoEl.removeEventListener("waiting",showLoader);
    videoEl.removeEventListener("stalled",showLoader);
    videoEl.removeEventListener("error",onError);
  };
  const finish=()=>{if(finished)return;finished=true;cleanup();hideLoader();onEnd?.()};
  const doFade=()=>{
    if(fading||finished)return;fading=true;hideLoader();
    try{videoEl.style.opacity="0";videoEl.style.filter="blur(6px)";videoEl.volume=0}catch{}
    fadeTimer=setTimeout(finish,740);
  };
  const onTime=()=>{if(Number.isFinite(videoEl.duration)&&videoEl.duration>0&&videoEl.duration-videoEl.currentTime<=.72)doFade()};
  const onPlaying=()=>{
    hideLoader();clearTimeout(safetyTimer);
    const remaining=Number.isFinite(videoEl.duration)&&videoEl.duration>0?Math.max(1,videoEl.duration-videoEl.currentTime):12;
    safetyTimer=setTimeout(doFade,Math.min(20000,remaining*1000+2500));
  };
  const onCanPlay=()=>{if(!videoEl.paused)hideLoader()};
  const onError=()=>{hideLoader();doFade()};
  try{
    videoEl.pause();videoEl.currentTime=0;videoEl.style.opacity="1";
    videoEl.style.transition="opacity .72s cubic-bezier(.4,0,.2,1),filter .72s cubic-bezier(.4,0,.2,1)";
    videoEl.style.willChange="opacity, filter";videoEl.style.filter="none";
    videoEl.muted=preferMuted;videoEl.volume=1;
  }catch{}
  showLoader();
  videoEl.addEventListener("timeupdate",onTime);
  videoEl.addEventListener("playing",onPlaying);
  videoEl.addEventListener("canplay",onCanPlay);
  videoEl.addEventListener("waiting",showLoader);
  videoEl.addEventListener("stalled",showLoader);
  videoEl.addEventListener("error",onError);
  videoEl.onended=doFade;
  safetyTimer=setTimeout(doFade,20000);
  const tryMuted=()=>{try{videoEl.muted=true;return videoEl.play()}catch{return Promise.reject()}};
  try{
    const attempt=videoEl.play();
    if(attempt?.catch)attempt.catch(()=>tryMuted().catch(doFade));
  }catch{tryMuted().catch(doFade)}
}
